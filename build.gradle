plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = mod_group_id

// Single source of truth for the shipped version is `version=` in
// gradle.properties, the file the release gate reads. A release workflow may
// override it with `-Pmod_version=<version>`.
def modVersion = (findProperty("mod_version") ?: project.version) as String
version = modVersion

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

// Keep each authored voxel source reviewable while packaging the binary .vox resource (MINECRAFT-258).
def generatedVox = layout.buildDirectory.dir('generated/vox-resources')
def battleAxeMaterials = ['wood', 'stone', 'copper', 'iron', 'gold', 'diamond', 'netherite']
// Resolved to plain, config-cache-safe File objects now (at configuration time); doLast below
// must not call back into `layout`/`project` itself, only use these already-resolved values.
def battleAxeVoxSources = battleAxeMaterials.collectEntries { material ->
    [(material): layout.projectDirectory.file("src/main/resources/assets/${mod_id}/vox/${material}_battle_axe.vox.hex").asFile]
}
def battleAxeVoxOutputDir = generatedVox.map { it.dir("assets/${mod_id}/vox") }
def materializeBattleAxeVox = tasks.register('materializeBattleAxeVox') {
    battleAxeVoxSources.values().each { inputs.file(it) }
    outputs.dir(battleAxeVoxOutputDir)
    doLast {
        def outDir = battleAxeVoxOutputDir.get().asFile
        battleAxeVoxSources.each { material, source ->
            def hex = source.text.replaceAll('[^0-9A-Fa-f]', '')
            def out = new File(outDir, "${material}_battle_axe.vox")
            out.parentFile.mkdirs()
            out.bytes = java.util.HexFormat.of().parseHex(hex)
        }
    }
}
sourceSets.main.resources.srcDir(generatedVox)
tasks.named('processResources') { dependsOn materializeBattleAxeVox }
tasks.named('jar') { dependsOn materializeBattleAxeVox }

// The shared loader release is vendored from the official release asset and hash-verified (MINECRAFT-258).
def magicVoxelLoaderJar = layout.projectDirectory.file("libs/magicavoxel-loader-${project.magicavoxel_loader_version}.jar")
def magicVoxelLoaderSha256 = project.magicavoxel_loader_sha256
tasks.register('verifyMagicVoxelLoader') {
    inputs.file(magicVoxelLoaderJar)
    doLast {
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        def actual = digest.digest(magicVoxelLoaderJar.asFile.bytes).encodeHex().toString()
        if (actual != magicVoxelLoaderSha256) {
            throw new GradleException("magicavoxel-loader ${project.magicavoxel_loader_version} sha256 mismatch: ${actual}")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay'))
            }
            if (project.hasProperty('quickPlayMp')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlayMp'))
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Without this, `src/test` has no NeoForge/Minecraft classes on its
    // compile classpath at all (Tier, AxeItem, DeferredItem, DataComponents,
    // etc.), which is exactly what the unit tests under
    // src/test/java/.../dynamicbattleaxes need.
    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

dependencies {
    implementation files(magicVoxelLoaderJar).builtBy("verifyMagicVoxelLoader")
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // For parsing the hand-written recipe/lang JSON files in tests; Mojang's
    // own code depends on the same Gson version, pinned here explicitly
    // rather than relying on it being transitively on the test classpath.
    testImplementation "com.google.code.gson:gson:2.10.1"
}

test {
    useJUnitPlatform()
}

// Expands `${mod_version}` and friends in neoforge.mods.toml to the values
// computed above, so the jar's file name and the version baked into the
// built jar's mods.toml can never drift apart.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
